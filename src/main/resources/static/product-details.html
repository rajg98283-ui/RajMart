
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Raj Mart - Product Details</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            background: #f5f7fb;

            color: #172033;
        }


        /* =========================
           HEADER
        ========================== */

        header {

            background:
                    linear-gradient(
                            135deg,
                            #111827,
                            #312e81
                    );

            color: white;

            padding: 18px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            font-size: 24px;

            font-weight: 800;
        }


        nav {

            display: flex;

            align-items: center;

            gap: 20px;
        }


        nav a {

            color: white;

            text-decoration: none;

            font-weight: 600;
        }


        nav a:hover {

            text-decoration: underline;
        }


        /* =========================
           CONTAINER
        ========================== */

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 30px auto 50px;
        }


        /* =========================
           BREADCRUMB
        ========================== */

        .breadcrumb {

            margin-bottom: 18px;

            color: #667085;

            font-size: 14px;
        }


        .breadcrumb a {

            color: #4338ca;

            text-decoration: none;

            font-weight: 600;
        }


        /* =========================
           PRODUCT
        ========================== */

        .product {

            background: white;

            border-radius: 22px;

            padding: 35px;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            gap: 45px;

            box-shadow:
                    0 12px 35px
                    rgba(0,0,0,.07);
        }


        /* =========================
           IMAGE
        ========================== */

        .image-box {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        .product-image {

            width: 100%;

            height: 480px;

            background: #eef1f7;

            border-radius: 18px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .no-image {

            color: #64748b;

            font-weight: 700;

            font-size: 18px;
        }


        /* =========================
           PRODUCT INFO
        ========================== */

        .category {

            display: inline-block;

            background: #eef2ff;

            color: #4338ca;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 800;

            text-transform: uppercase;
        }


        h1 {

            font-size: 38px;

            line-height: 1.2;

            margin: 15px 0 10px;
        }


        .rating-box {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 10px 0 18px;
        }


        .stars {

            color: #f59e0b;

            font-size: 20px;

            letter-spacing: 2px;
        }


        .rating-text {

            color: #667085;

            font-size: 14px;
        }


        .price {

            font-size: 34px;

            font-weight: 800;

            margin: 18px 0;
        }


        .description {

            color: #667085;

            line-height: 1.7;

            font-size: 16px;
        }


        /* =========================
           STOCK
        ========================== */

        .stock-box {

            margin-top: 20px;

            padding: 14px;

            border-radius: 10px;

            background: #f8fafc;
        }


        .stock-in {

            color: #15803d;

            font-weight: 800;
        }


        .stock-low {

            color: #dc2626;

            font-weight: 800;
        }


        .stock-out {

            color: #dc2626;

            font-weight: 800;
        }


        /* =========================
           QUANTITY
        ========================== */

        .quantity-section {

            margin-top: 22px;
        }


        .quantity-section label {

            display: block;

            margin-bottom: 8px;

            font-weight: 700;
        }


        .quantity-controls {

            display: flex;

            width: fit-content;

            border:
                    1px solid #d9deea;

            border-radius: 10px;

            overflow: hidden;
        }


        .quantity-controls button {

            width: 42px;

            height: 42px;

            border: none;

            background: #f8fafc;

            cursor: pointer;

            font-size: 20px;

            font-weight: bold;
        }


        .quantity-controls button:hover {

            background: #eef2ff;
        }


        .quantity-controls input {

            width: 60px;

            height: 42px;

            border: none;

            border-left:
                    1px solid #d9deea;

            border-right:
                    1px solid #d9deea;

            text-align: center;

            font-size: 16px;

            outline: none;
        }


        /* =========================
           ACTION BUTTONS
        ========================== */

        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            margin-top: 25px;
        }


        .btn {

            border: none;

            padding: 15px;

            border-radius: 10px;

            font-weight: 800;

            font-size: 15px;

            cursor: pointer;
        }


        .btn:disabled {

            opacity: .5;

            cursor: not-allowed;
        }


        .cart-btn {

            background: #111827;

            color: white;
        }


        .cart-btn:hover {

            background: #1f2937;
        }


        .buy-btn {

            background: #f59e0b;

            color: #111827;
        }


        .buy-btn:hover {

            background: #d97706;
        }


        /* =========================
           INFO CARDS
        ========================== */

        .info-grid {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 15px;

            margin-top: 20px;
        }


        .info-card {

            background: #f8fafc;

            border-radius: 12px;

            padding: 16px;

            text-align: center;
        }


        .info-card strong {

            display: block;

            margin-bottom: 5px;
        }


        .info-card span {

            color: #667085;

            font-size: 13px;
        }


        /* =========================
           MESSAGE
        ========================== */

        .message {

            margin-top: 14px;

            min-height: 20px;

            font-weight: 700;
        }


        .message.success {

            color: #15803d;
        }


        .message.error {

            color: #dc2626;
        }


        /* =========================
           REVIEWS
        ========================== */

        .reviews-section {

            margin-top: 25px;

            background: white;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                    0 8px 25px
                    rgba(0,0,0,.06);
        }


        .reviews-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 20px;
        }


        .reviews-header h2 {

            margin: 0;
        }


        .average-rating {

            background: #fff7ed;

            padding: 10px 15px;

            border-radius: 10px;

            font-weight: 700;

            color: #92400e;
        }


        /* =========================
           WRITE REVIEW
        ========================== */

        .write-review {

            background: #f8fafc;

            border:
                    1px solid #e5e7eb;

            border-radius: 14px;

            padding: 22px;

            margin-bottom: 25px;
        }


        .write-review h3 {

            margin-top: 0;

            margin-bottom: 18px;
        }


        .form-group {

            margin-bottom: 15px;
        }


        .form-group label {

            display: block;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border:
                    1px solid #d9deea;

            border-radius: 9px;

            font-size: 14px;

            outline: none;
        }


        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #6366f1;
        }


        .form-group textarea {

            min-height: 110px;

            resize: vertical;
        }


        /* =========================
           STAR INPUT
        ========================== */

        .star-input {

            display: flex;

            gap: 6px;

            margin-top: 5px;
        }


        .star-input button {

            background: transparent;

            border: none;

            padding: 0;

            cursor: pointer;

            font-size: 30px;

            color: #cbd5e1;

            line-height: 1;
        }


        .star-input button.active {

            color: #f59e0b;
        }


        .submit-review {

            background: #2563eb;

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: 800;
        }


        .submit-review:hover {

            background: #1d4ed8;
        }


        .submit-review:disabled {

            opacity: .6;

            cursor: not-allowed;
        }


        /* =========================
           REVIEW LIST
        ========================== */

        .review {

            border-bottom:
                    1px solid #eaecf0;

            padding: 18px 0;
        }


        .review:last-child {

            border-bottom: none;
        }


        .review-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 10px;

            flex-wrap: wrap;
        }


        .review-name {

            font-weight: 800;
        }


        .review-date {

            color: #98a2b3;

            font-size: 12px;
        }


        .review-rating {

            color: #f59e0b;

            margin: 7px 0;
        }


        .review p {

            color: #667085;

            line-height: 1.6;

            margin: 5px 0 0;
        }


        .no-reviews {

            text-align: center;

            padding: 25px;

            color: #667085;
        }


        /* =========================
           LOADING
        ========================== */

        .loading {

            background: white;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            color: #667085;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media(max-width:850px) {

            .product {

                grid-template-columns: 1fr;

                padding: 22px;
            }


            .product-image {

                height: 350px;
            }


            h1 {

                font-size: 30px;
            }


            .price {

                font-size: 28px;
            }


            .info-grid {

                grid-template-columns: 1fr;
            }

        }


        @media(max-width:600px) {

            header {

                padding: 15px;
            }


            .logo {

                font-size: 19px;
            }


            nav {

                gap: 8px;
            }


            nav a {

                font-size: 12px;
            }


            .container {

                width: 94%;

                margin-top: 20px;
            }


            .actions {

                grid-template-columns: 1fr;
            }


            .product-image {

                height: 300px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================== -->

<header>

    <div class="logo">
        RAJ MART
    </div>


    <nav>

        <a href="/products.html">
            Products
        </a>

        <a href="/cart.html">
            Cart 🛒
        </a>

        <a href="/orders.html">
            My Orders
        </a>

    </nav>

</header>


<div class="container">


    <!-- =========================
         BREADCRUMB
    ========================== -->

    <div class="breadcrumb">

        <a href="/products.html">
            Products
        </a>

        &nbsp; / &nbsp;

        Product Details

    </div>


    <!-- =========================
         PRODUCT
    ========================== -->

    <div id="productBox">

        <div class="loading">
            Loading product...
        </div>

    </div>


    <!-- =========================
         REVIEWS
    ========================== -->

    <div class="reviews-section">

        <div class="reviews-header">

            <h2>
                ⭐ Customer Reviews
            </h2>


            <div
                    id="averageRating"
                    class="average-rating"
            >
                No ratings yet
            </div>

        </div>


        <!-- WRITE REVIEW -->

        <div class="write-review">

            <h3>
                Write a Review
            </h3>


            <div class="form-group">

                <label for="customerName">
                    Your Name
                </label>

                <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your name"
                >

            </div>


            <div class="form-group">

                <label>
                    Your Rating
                </label>


                <div
                        id="starInput"
                        class="star-input"
                >

                    <button
                            type="button"
                            onclick="selectRating(1)"
                            data-rating="1"
                    >
                        ★
                    </button>

                    <button
                            type="button"
                            onclick="selectRating(2)"
                            data-rating="2"
                    >
                        ★
                    </button>

                    <button
                            type="button"
                            onclick="selectRating(3)"
                            data-rating="3"
                    >
                        ★
                    </button>

                    <button
                            type="button"
                            onclick="selectRating(4)"
                            data-rating="4"
                    >
                        ★
                    </button>

                    <button
                            type="button"
                            onclick="selectRating(5)"
                            data-rating="5"
                    >
                        ★
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="reviewText">
                    Your Review
                </label>

                <textarea
                        id="reviewText"
                        placeholder="Write your experience with this product..."
                ></textarea>

            </div>


            <button
                    id="submitReviewBtn"
                    class="submit-review"
                    onclick="submitReview()"
            >
                Submit Review
            </button>


            <div
                    id="reviewMessage"
                    class="message"
            ></div>

        </div>


        <!-- REVIEW LIST -->

        <div id="reviews">

            <div class="loading">
                Loading reviews...
            </div>

        </div>

    </div>

</div>


<script>

    /* =========================
       PRODUCT ID
    ========================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const productId =
        params.get("id");


    let product = null;

    let selectedRating = 0;

    let currentReviews = [];


    /* =========================
       LOAD PRODUCT
    ========================== */

    async function loadProduct() {

        const productBox =
            document.getElementById(
                "productBox"
            );


        if (!productId) {

            productBox.innerHTML = `

                <div class="loading">

                    Product ID is missing.

                </div>

            `;

            return;
        }


        try {

            const response =
                await fetch(
                    "/api/products",
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Products API failed: " +
                    response.status
                );

            }


            const products =
                await response.json();


            product =
                products.find(
                    function(item) {

                        return Number(
                            item.id
                        ) === Number(
                            productId
                        );

                    }
                );


            if (!product) {

                productBox.innerHTML = `

                    <div class="loading">

                        <h2>
                            Product not found
                        </h2>

                        <p>
                            This product may have been removed.
                        </p>

                    </div>

                `;

                return;
            }


            renderProduct();


            loadReviews();

        }
        catch (error) {

            console.error(
                "PRODUCT DETAILS ERROR:",
                error
            );


            productBox.innerHTML = `

                <div class="loading">

                    <h2>
                        Unable to load product
                    </h2>

                    <p>
                        ${escapeHtml(
                error.message
            )}
                    </p>

                </div>

            `;

        }

    }


    /* =========================
       RENDER PRODUCT
    ========================== */

    function renderProduct() {

        const productBox =
            document.getElementById(
                "productBox"
            );


        const name =
            product.name ||
            "Unknown Product";


        const price =
            Number(
                product.price || 0
            );


        const stock =
            Number(
                product.quantity ??
                product.stock ??
                0
            );


        const image =
            product.image ||
            product.image_url ||
            "";


        const category =
            product.category ||
            detectCategory(
                name
            );


        const description =
            product.description ||
            "Quality product available at Raj Mart.";


        let imageHtml;


        if (image) {

            imageHtml = `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(name)}"
                    onerror="showNoImage(this)"
                >

            `;

        } else {

            imageHtml = `

                <div class="no-image">
                    No Image Available
                </div>

            `;

        }


        let stockText;

        let stockClass;


        if (stock <= 0) {

            stockText =
                "Out of Stock";

            stockClass =
                "stock-out";

        }
        else if (stock <= 5) {

            stockText =
                "Only " +
                stock +
                " left";

            stockClass =
                "stock-low";

        }
        else {

            stockText =
                stock +
                " items available";

            stockClass =
                "stock-in";

        }


        const disabled =
            stock <= 0
                ? "disabled"
                : "";


        productBox.innerHTML = `

            <div class="product">


                <!-- IMAGE -->

                <div class="image-box">

                    <div class="product-image">

                        ${imageHtml}

                    </div>


                    <div class="info-grid">

                        <div class="info-card">

                            <strong>
                                🚚 Delivery
                            </strong>

                            <span>
                                Available
                            </span>

                        </div>


                        <div class="info-card">

                            <strong>
                                🔄 Returns
                            </strong>

                            <span>
                                Easy returns
                            </span>

                        </div>


                        <div class="info-card">

                            <strong>
                                🔒 Secure
                            </strong>

                            <span>
                                Safe checkout
                            </span>

                        </div>

                    </div>

                </div>


                <!-- DETAILS -->

                <div>

                    <div class="category">

                        ${escapeHtml(
            category
        )}

                    </div>


                    <h1>

                        ${escapeHtml(
            name
        )}

                    </h1>


                    <div class="rating-box">

                        <span
                            id="productStars"
                            class="stars"
                        >
                            ☆☆☆☆☆
                        </span>

                        <span
                            id="productRatingText"
                            class="rating-text"
                        >
                            No ratings yet
                        </span>

                    </div>


                    <div class="price">

                        ₹${price.toFixed(2)}

                    </div>


                    <p class="description">

                        ${escapeHtml(
            description
        )}

                    </p>


                    <div class="stock-box">

                        <span
                            class="${stockClass}"
                        >
                            ${escapeHtml(
            stockText
        )}
                        </span>

                    </div>


                    <!-- QUANTITY -->

                    <div class="quantity-section">

                        <label>
                            Quantity
                        </label>


                        <div class="quantity-controls">

                            <button
                                type="button"
                                onclick="decreaseQuantity()"
                                ${disabled}
                            >
                                −
                            </button>


                            <input
                                id="qty"
                                type="number"
                                min="1"
                                max="${stock}"
                                value="1"
                                ${disabled}
                                onchange="validateQuantity()"
                            >


                            <button
                                type="button"
                                onclick="increaseQuantity()"
                                ${disabled}
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- ACTIONS -->

                    <div class="actions">

                        <button
                            class="btn cart-btn"
                            onclick="addToCart(false)"
                            ${disabled}
                        >
                            🛒 Add to Cart
                        </button>


                        <button
                            class="btn buy-btn"
                            onclick="addToCart(true)"
                            ${disabled}
                        >
                            ⚡ Buy Now
                        </button>

                    </div>


                    <div
                        id="message"
                        class="message"
                    ></div>

                </div>

            </div>

        `;

    }


    /* =========================
       CATEGORY
    ========================== */

    function detectCategory(name) {

        const text =
            String(
                name || ""
            ).toLowerCase();


        if (
            text.includes("laptop") ||
            text.includes("phone") ||
            text.includes("headphone") ||
            text.includes("watch") ||
            text.includes("keyboard") ||
            text.includes("mouse")
        ) {

            return "Electronics";
        }


        if (
            text.includes("shoe") ||
            text.includes("shirt") ||
            text.includes("dress") ||
            text.includes("jeans")
        ) {

            return "Fashion";
        }


        if (
            text.includes("bag") ||
            text.includes("backpack")
        ) {

            return "Bags";
        }


        if (
            text.includes("book") ||
            text.includes("notebook")
        ) {

            return "Books";
        }


        return "General";

    }


    /* =========================
       QUANTITY
    ========================== */

    function getQuantity() {

        const input =
            document.getElementById(
                "qty"
            );


        if (!input) {

            return 1;
        }


        return Number(
            input.value
        );

    }


    function increaseQuantity() {

        if (!product) {

            return;
        }


        const input =
            document.getElementById(
                "qty"
            );


        const current =
            Number(
                input.value
            );


        const stock =
            Number(
                product.quantity ??
                product.stock ??
                0
            );


        if (
            current < stock
        ) {

            input.value =
                current + 1;

        }

    }


    function decreaseQuantity() {

        const input =
            document.getElementById(
                "qty"
            );


        if (!input) {

            return;
        }


        const current =
            Number(
                input.value
            );


        if (
            current > 1
        ) {

            input.value =
                current - 1;

        }

    }


    function validateQuantity() {

        if (!product) {

            return;
        }


        const input =
            document.getElementById(
                "qty"
            );


        const stock =
            Number(
                product.quantity ??
                product.stock ??
                0
            );


        let quantity =
            Number(
                input.value
            );


        if (
            !Number.isFinite(
                quantity
            ) ||
            quantity < 1
        ) {

            quantity = 1;

        }


        if (
            quantity > stock
        ) {

            quantity = stock;

        }


        input.value =
            quantity;

    }


    /* =========================
       CART
    ========================== */

    function addToCart(buyNow) {

        if (!product) {

            alert(
                "Product not available."
            );

            return;
        }


        const stock =
            Number(
                product.quantity ??
                product.stock ??
                0
            );


        const qty =
            getQuantity();


        if (
            stock <= 0
        ) {

            alert(
                "Product is out of stock."
            );

            return;
        }


        if (
            qty < 1 ||
            qty > stock
        ) {

            alert(
                "Please enter a valid quantity."
            );

            return;
        }


        let cart = [];


        try {

            cart =
                JSON.parse(
                    localStorage.getItem(
                        "cart"
                    ) || "[]"
                );


            if (
                !Array.isArray(
                    cart
                )
            ) {

                cart = [];

            }

        }
        catch (error) {

            console.error(
                "Cart parsing error:",
                error
            );

            cart = [];

        }


        const existing =
            cart.find(
                function(item) {

                    return Number(
                        item.id
                    ) === Number(
                        product.id
                    );

                }
            );


        if (existing) {

            const currentQuantity =
                Number(
                    existing.quantity || 0
                );


            if (
                currentQuantity + qty >
                stock
            ) {

                alert(
                    "Not enough stock available."
                );

                return;
            }


            existing.quantity =
                currentQuantity + qty;


            existing.stock =
                stock;


            existing.price =
                Number(
                    product.price
                );


            existing.name =
                product.name;


            existing.image =
                product.image || "";

        }
        else {

            cart.push({

                id:
                    Number(
                        product.id
                    ),

                name:
                product.name,

                price:
                    Number(
                        product.price
                    ),

                image:
                    product.image || "",

                quantity:
                qty,

                stock:
                stock

            });

        }


        localStorage.setItem(
            "cart",
            JSON.stringify(
                cart
            )
        );


        const message =
            document.getElementById(
                "message"
            );


        if (message) {

            message.className =
                "message success";

            message.textContent =
                "Product added to cart successfully.";

        }


        if (buyNow) {

            window.location.href =
                "/cart.html";

        }

    }


    /* =========================
       SELECT RATING
    ========================== */

    function selectRating(rating) {

        selectedRating =
            Number(
                rating
            );


        const buttons =
            document.querySelectorAll(
                "#starInput button"
            );


        buttons.forEach(
            function(button) {

                const buttonRating =
                    Number(
                        button.dataset.rating
                    );


                if (
                    buttonRating <=
                    selectedRating
                ) {

                    button.classList.add(
                        "active"
                    );

                }
                else {

                    button.classList.remove(
                        "active"
                    );

                }

            }
        );

    }


    /* =========================
       SUBMIT REVIEW
    ========================== */

    async function submitReview() {

        const nameInput =
            document.getElementById(
                "customerName"
            );


        const reviewInput =
            document.getElementById(
                "reviewText"
            );


        const message =
            document.getElementById(
                "reviewMessage"
            );


        const button =
            document.getElementById(
                "submitReviewBtn"
            );


        const customerName =
            nameInput.value.trim();


        const reviewText =
            reviewInput.value.trim();


        if (!customerName) {

            message.className =
                "message error";

            message.textContent =
                "Please enter your name.";

            return;
        }


        if (
            selectedRating < 1 ||
            selectedRating > 5
        ) {

            message.className =
                "message error";

            message.textContent =
                "Please select a rating.";

            return;
        }


        if (!reviewText) {

            message.className =
                "message error";

            message.textContent =
                "Please write your review.";

            return;
        }


        try {

            button.disabled =
                true;

            button.textContent =
                "Submitting...";


            message.className =
                "message";

            message.textContent =
                "Submitting your review...";


            const response =
                await fetch(
                    "/api/reviews",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                productId:
                                    Number(
                                        productId
                                    ),

                                customerName:
                                customerName,

                                rating:
                                selectedRating,

                                reviewText:
                                reviewText

                            })
                    }
                );


            const data =
                await response.json();


            console.log(
                "REVIEW RESPONSE:",
                data
            );


            if (
                !response.ok ||
                !data.success
            ) {

                message.className =
                    "message error";

                message.textContent =
                    data.message ||
                    "Failed to add review.";

                return;
            }


            message.className =
                "message success";

            message.textContent =
                "Review added successfully!";


            nameInput.value =
                "";


            reviewInput.value =
                "";


            selectedRating =
                0;


            document
                .querySelectorAll(
                    "#starInput button"
                )
                .forEach(
                    function(star) {

                        star.classList.remove(
                            "active"
                        );

                    }
                );


            await loadReviews();


        }
        catch (error) {

            console.error(
                "SUBMIT REVIEW ERROR:",
                error
            );


            message.className =
                "message error";

            message.textContent =
                "Unable to connect to review server.";

        }
        finally {

            button.disabled =
                false;

            button.textContent =
                "Submit Review";

        }

    }


    /* =========================
       LOAD REVIEWS
    ========================== */

    async function loadReviews() {

        const container =
            document.getElementById(
                "reviews"
            );


        try {

            const response =
                await fetch(
                    "/api/reviews/" +
                    productId,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                container.innerHTML = `

                    <div class="no-reviews">

                        No reviews available yet.

                    </div>

                `;

                updateRatingSummary(
                    []
                );

                return;
            }


            const reviews =
                await response.json();


            if (
                !Array.isArray(
                    reviews
                )
            ) {

                updateRatingSummary(
                    []
                );

                container.innerHTML = `

                    <div class="no-reviews">

                        No reviews yet. Be the first to review!

                    </div>

                `;

                return;
            }


            currentReviews =
                reviews;


            updateRatingSummary(
                reviews
            );


            if (
                reviews.length === 0
            ) {

                container.innerHTML = `

                    <div class="no-reviews">

                        No reviews yet.
                        Be the first to review!

                    </div>

                `;

                return;
            }


            container.innerHTML =
                reviews.map(
                    function(review) {

                        const name =
                            review.customerName ||
                            review.customer_name ||
                            "Customer";


                        const rating =
                            Math.max(
                                0,
                                Math.min(
                                    5,
                                    Number(
                                        review.rating || 0
                                    )
                                )
                            );


                        const text =
                            review.reviewText ||
                            review.review_text ||
                            review.comment ||
                            "";


                        const date =
                            review.reviewDate ||
                            review.review_date ||
                            "";


                        const stars =
                            "★".repeat(
                                rating
                            ) +
                            "☆".repeat(
                                5 - rating
                            );


                        return `

                            <div class="review">

                                <div class="review-top">

                                    <div class="review-name">

                                        ${escapeHtml(
                            name
                        )}

                                    </div>


                                    <div class="review-date">

                                        ${escapeHtml(
                            formatReviewDate(
                                date
                            )
                        )}

                                    </div>

                                </div>


                                <div class="review-rating">

                                    ${stars}

                                    <span
                                        style="
                                            color:#667085;
                                            font-size:13px;
                                            margin-left:5px;
                                        "
                                    >
                                        ${rating}/5
                                    </span>

                                </div>


                                <p>

                                    ${escapeHtml(
                            text
                        )}

                                </p>

                            </div>

                        `;

                    }
                )
                    .join("");

        }
        catch (error) {

            console.error(
                "REVIEWS ERROR:",
                error
            );


            updateRatingSummary(
                []
            );


            container.innerHTML = `

                <div class="no-reviews">

                    No reviews available.

                </div>

            `;

        }

    }


    /* =========================
       RATING SUMMARY
    ========================== */

    function updateRatingSummary(
        reviews
    ) {

        const averageElement =
            document.getElementById(
                "averageRating"
            );


        const starElement =
            document.getElementById(
                "productStars"
            );


        const textElement =
            document.getElementById(
                "productRatingText"
            );


        if (
            !reviews ||
            reviews.length === 0
        ) {

            averageElement.textContent =
                "No ratings yet";


            if (starElement) {

                starElement.textContent =
                    "☆☆☆☆☆";

            }


            if (textElement) {

                textElement.textContent =
                    "No ratings yet";

            }


            return;
        }


        const total =
            reviews.reduce(
                function(sum, review) {

                    return sum +
                        Number(
                            review.rating || 0
                        );

                },
                0
            );


        const average =
            total /
            reviews.length;


        const rounded =
            Math.round(
                average
            );


        const stars =
            "★".repeat(
                rounded
            ) +
            "☆".repeat(
                5 - rounded
            );


        averageElement.textContent =
            average.toFixed(1) +
            " / 5  •  " +
            reviews.length +
            " review" +
            (
                reviews.length === 1
                    ? ""
                    : "s"
            );


        if (starElement) {

            starElement.textContent =
                stars;

        }


        if (textElement) {

            textElement.textContent =
                average.toFixed(1) +
                " from " +
                reviews.length +
                " review" +
                (
                    reviews.length === 1
                        ? ""
                        : "s"
                );

        }

    }


    /* =========================
       REVIEW DATE
    ========================== */

    function formatReviewDate(
        value
    ) {

        if (!value) {

            return "";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day:
                    "2-digit",

                month:
                    "short",

                year:
                    "numeric"
            }
        );

    }


    /* =========================
       IMAGE ERROR
    ========================== */

    function showNoImage(
        image
    ) {

        image.style.display =
            "none";


        image.parentElement.innerHTML = `

            <div class="no-image">

                No Image Available

            </div>

        `;

    }


    /* =========================
       HTML SECURITY
    ========================== */

    function escapeHtml(
        value
    ) {

        return String(
            value ?? ""
        )
            .replaceAll(
                "&",
                "&amp;"
            )
            .replaceAll(
                "<",
                "&lt;"
            )
            .replaceAll(
                ">",
                "&gt;"
            )
            .replaceAll(
                '"',
                "&quot;"
            )
            .replaceAll(
                "'",
                "&#039;"
            );

    }


    /* =========================
       START
    ========================= */

    loadProduct();

</script>
