</div>

<script>

    // =========================================
    // GET LOGGED-IN EMAIL
    // =========================================

    function getCustomerEmail() {

        // RajMart login stores the email here.
        const email = localStorage.getItem("userEmail");

        if (email && email.trim() !== "") {
            return email.trim();
        }

        return null;
    }


    // =========================================
    // LOAD ORDERS
    // =========================================

    async function loadOrders() {

        const container =
            document.getElementById("ordersContainer");

        const email = getCustomerEmail();

        if (!email) {

            container.innerHTML = `
                <div class="error">
                    <h3>Login required</h3>
                    <p>Please login to view your orders.</p>
                </div>
            `;

            return;
        }

        container.innerHTML = `
            <div class="loading">
                Loading your orders...
            </div>
        `;

        try {

            const response = await fetch(
                "/api/orders/user?email=" +
                encodeURIComponent(email)
            );

            console.log(
                "ORDER API STATUS =",
                response.status
            );

            if (!response.ok) {
                throw new Error("Unable to load orders.");
            }

            const orders = await response.json();

            console.log("ORDERS =", orders);

            if (!orders || orders.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <h3>No orders found</h3>
                        <p>You have not placed any orders yet.</p>

                        <br>

                        <a
                            href="/products.html"
                            class="back-btn"
                        >
                            Start Shopping
                        </a>
                    </div>
                `;

                return;
            }

            container.innerHTML = "";

            for (const order of orders) {

                await renderOrder(
                    order,
                    container
                );
            }

        } catch (error) {

            console.error(
                "ORDER LOAD ERROR =",
                error
            );

            container.innerHTML = `
                <div class="error">

                    <h3>Unable to load orders</h3>

                    <p>
                        ${escapeHtml(error.message)}
                    </p>

                    <button
                        class="retry"
                        onclick="loadOrders()"
                    >
                        Retry
                    </button>

                </div>
            `;
        }
    }


    // =========================================
    // RENDER ORDER
    // =========================================

    async function renderOrder(order, container) {

        const orderId =
            Number(
                order.id ??
                order.orderId ??
                0
            );

        const rawStatus =
            String(
                order.status ??
                "UNKNOWN"
            );

        const normalizedStatus =
            rawStatus.trim().toUpperCase();

        let statusClass =
            normalizedStatus.toLowerCase();

        if (normalizedStatus === "PROCESSING") {
            statusClass = "processing";
        }

        if (normalizedStatus === "CANCELLED") {
            statusClass = "cancelled";
        }

        const total =
            Number(
                order.totalAmount ??
                order.total ??
                order.amount ??
                0
            );

        const orderDate =
            order.createdAt ??
            order.orderDate ??
            order.created_at ??
            "";

        const card =
            document.createElement("div");

        card.className = "order-card";

        card.innerHTML = `

            <div class="order-header">

                <div class="order-id">
                    Order #${orderId}
                </div>

                <div class="status ${statusClass}">
                    ${escapeHtml(normalizedStatus)}
                </div>

            </div>

            <div class="order-info">

                <div>
                    <strong>Total:</strong>
                    ₹${total.toFixed(2)}
                </div>

                ${
            orderDate
                ?
                `
                        <div>
                            <strong>Date:</strong>
                            ${escapeHtml(String(orderDate))}
                        </div>
                    `
                :
                ""
        }

            </div>

            <div class="items">

                <h3>Order Items</h3>

                <div class="items-container">
                    Loading items...
                </div>

            </div>

            <div class="action-container"></div>

        `;

        container.appendChild(card);


        // =====================================
        // LOAD ORDER ITEMS
        // =====================================

        try {

            const itemResponse =
                await fetch(
                    "/api/orders/" +
                    orderId +
                    "/items"
                );

            if (itemResponse.ok) {

                const itemData =
                    await itemResponse.json();

                const itemsContainer =
                    card.querySelector(
                        ".items-container"
                    );

                if (
                    !itemData ||
                    itemData.length === 0
                ) {

                    itemsContainer.innerHTML =
                        "<p>No item details available.</p>";

                } else {

                    itemsContainer.innerHTML =
                        itemData
                            .map(item => {

                                const name =
                                    item.productName ??
                                    item.name ??
                                    "Product";

                                const quantity =
                                    Number(
                                        item.quantity ??
                                        0
                                    );

                                const price =
                                    Number(
                                        item.unitPrice ??
                                        item.price ??
                                        0
                                    );

                                return `

                                    <div class="item">

                                        <div>

                                            <div class="item-name">
                                                ${escapeHtml(
                                    String(name)
                                )}
                                            </div>

                                            <div class="item-details">
                                                Quantity:
                                                ${quantity}
                                            </div>

                                        </div>

                                        <div>
                                            ₹${price.toFixed(2)}
                                        </div>

                                    </div>

                                `;

                            })
                            .join("");
                }

            } else {

                card.querySelector(
                    ".items-container"
                ).innerHTML =
                    "<p>Unable to load item details.</p>";
            }

        } catch (error) {

            console.error(
                "ITEM LOAD ERROR =",
                error
            );

            card.querySelector(
                ".items-container"
            ).innerHTML =
                "<p>Unable to load item details.</p>";
        }


        // =====================================
        // CANCEL BUTTON
        // =====================================

        const canCancel =
            normalizedStatus === "PENDING" ||
            normalizedStatus === "PLACED" ||
            normalizedStatus === "CONFIRMED";

        const actionContainer =
            card.querySelector(
                ".action-container"
            );

        if (canCancel) {

            actionContainer.innerHTML = `

                <div class="actions">

                    <button
                        class="cancel-btn"
                        onclick="cancelOrder(${orderId}, this)"
                    >
                        Cancel Order
                    </button>

                </div>

            `;
        }


        // =====================================
        // CANCELLED MESSAGE
        // =====================================

        if (normalizedStatus === "CANCELLED") {

            actionContainer.innerHTML = `

                <div class="cancelled-message">
                    This order has been cancelled.
                </div>

            `;
        }
    }


    // =========================================
    // CANCEL ORDER
    // =========================================

    async function cancelOrder(orderId, button) {

        const confirmed =
            confirm(
                "Are you sure you want to cancel Order #" +
                orderId +
                "?"
            );

        if (!confirmed) {
            return;
        }


        // =====================================
        // GET EMAIL DIRECTLY FROM LOGIN STORAGE
        // =====================================

        const email =
            localStorage.getItem("userEmail");

        console.log(
            "CANCEL ORDER ID =",
            orderId
        );

        console.log(
            "CANCEL EMAIL =",
            email
        );


        if (!email || email.trim() === "") {

            alert(
                "Your login email was not found. Please login again."
            );

            return;
        }


        // =====================================
        // DISABLE ONLY CLICKED BUTTON
        // =====================================

        if (button) {

            button.disabled = true;

            button.textContent =
                "Cancelling...";
        }


        try {

            // =================================
            // EXACT SAME API FORMAT THAT
            // SUCCESSFULLY RETURNED STATUS 200
            // =================================

            const url =
                "/api/orders/" +
                orderId +
                "/cancel?email=" +
                encodeURIComponent(
                    email.trim()
                );

            console.log(
                "CANCEL URL =",
                url
            );


            const response =
                await fetch(
                    url,
                    {
                        method: "PUT"
                    }
                );


            console.log(
                "CANCEL API STATUS =",
                response.status
            );


            const responseText =
                await response.text();

            console.log(
                "CANCEL API RAW RESPONSE =",
                responseText
            );


            let data = {};

            try {

                data =
                    JSON.parse(
                        responseText
                    );

            } catch (error) {

                console.warn(
                    "Unable to parse response as JSON."
                );
            }


            console.log(
                "CANCEL API RESPONSE =",
                data
            );


            // =================================
            // HANDLE BACKEND ERROR
            // =================================

            if (!response.ok) {

                throw new Error(
                    data.message ||
                    responseText ||
                    "Unable to cancel order."
                );
            }


            if (
                data.success !== true
            ) {

                throw new Error(
                    data.message ||
                    "Unable to cancel order."
                );
            }


            // =================================
            // SUCCESS
            // =================================

            alert(
                data.message ||
                "Order #" +
                orderId +
                " cancelled successfully!"
            );


            // Reload orders so status becomes CANCELLED
            await loadOrders();


        } catch (error) {

            console.error(
                "CANCEL ORDER ERROR =",
                error
            );

            alert(
                "Failed to cancel order.\n\n" +
                error.message
            );


            if (button) {

                button.disabled = false;

                button.textContent =
                    "Cancel Order";
            }
        }
    }


    // =========================================
    // HTML ESCAPE
    // =========================================

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // =========================================
    // START
    // =========================================

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            loadOrders();

        }
    );

</script>
