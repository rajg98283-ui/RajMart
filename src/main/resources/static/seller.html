<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Raj Mart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 24px;
        }

        .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-btn,
        .logout-btn {
            text-decoration: none;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .header-btn {
            background: #2563eb;
        }

        .logout-btn {
            background: #dc2626;
            border: none;
            cursor: pointer;
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #111827;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .card-title h2 {
            font-size: 21px;
        }

        /* ADD PRODUCT */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .primary-btn {
            margin-top: 18px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .primary-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .refresh-btn {
            margin-top: 0;
            background: #0f766e;
        }

        .refresh-btn:hover {
            background: #115e59;
        }

        /* PRODUCTS */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 18px;
        }

        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            background: white;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #f1f5f9;
        }

        .no-image {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            border-radius: 10px;
            color: #64748b;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .stock {
            margin-bottom: 10px;
        }

        .stock.available {
            color: #16a34a;
        }

        .stock.low {
            color: #dc2626;
        }

        .delete-btn {
            width: 100%;
            margin-top: 15px;
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .delete-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ORDERS */

        .table-wrapper {
            overflow-x: auto;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .order-table th,
        .order-table td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .order-table th {
            background: #f8fafc;
            font-size: 14px;
            color: #475569;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 12px;
            font-weight: bold;
        }

        .loading {
            color: #64748b;
            padding: 15px 0;
        }

        .error {
            color: #dc2626;
            padding: 12px 0;
            margin-top: 8px;
        }

        .success {
            color: #16a34a;
            padding: 12px 0;
            margin-top: 8px;
            font-weight: bold;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 1000px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .stats,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header-right {
                gap: 5px;
            }

            .header-btn,
            .logout-btn {
                padding: 8px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <h1>Raj Mart - Seller Dashboard</h1>

    <div class="header-right">

        <a
                href="/index.html"
                class="header-btn"
        >
            View Store
        </a>

        <button
                class="logout-btn"
                onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="container">

    <!-- =========================
         STATISTICS
    ========================== -->

    <section class="stats">

        <div class="stat-card">
            <h3>Total Products</h3>
            <p id="productCount">0</p>
        </div>

        <div class="stat-card">
            <h3>Incoming Orders</h3>
            <p id="incomingOrders">0</p>
        </div>

        <div class="stat-card">
            <h3>Seller Status</h3>
            <p style="font-size:20px;color:#16a34a;">
                ACTIVE
            </p>
        </div>

    </section>


    <!-- =========================
         ADD PRODUCT
    ========================== -->

    <section class="card">

        <div class="card-title">
            <h2>Add Product</h2>
        </div>

        <form
                id="productForm"
                enctype="multipart/form-data"
        >

            <div class="form-grid">

                <div class="form-group">

                    <label for="productName">
                        Product Name
                    </label>

                    <input
                            type="text"
                            id="productName"
                            placeholder="Enter product name"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="productPrice">
                        Price
                    </label>

                    <input
                            type="number"
                            id="productPrice"
                            placeholder="Enter price"
                            min="0"
                            step="0.01"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="productQuantity">
                        Quantity
                    </label>

                    <input
                            type="number"
                            id="productQuantity"
                            placeholder="Enter quantity"
                            min="0"
                            step="1"
                            required
                    >

                </div>


                <div class="form-group">

                    <label for="productImage">
                        Product Image
                    </label>

                    <input
                            type="file"
                            id="productImage"
                            accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
                    >

                </div>

            </div>


            <button
                    type="submit"
                    class="primary-btn"
                    id="addProductBtn"
            >
                Add Product
            </button>


            <p id="productMessage"></p>

        </form>

    </section>


    <!-- =========================
         PRODUCTS
    ========================== -->

    <section class="card">

        <div class="card-title">

            <h2>Products</h2>

            <button
                    class="primary-btn refresh-btn"
                    onclick="loadProducts()"
            >
                Refresh
            </button>

        </div>


        <div
                id="productsContainer"
                class="loading"
        >
            Loading products...
        </div>

    </section>


    <!-- =========================
         INCOMING ORDERS
    ========================== -->

    <section class="card">

        <div class="card-title">

            <h2>Incoming Orders</h2>

            <button
                    class="primary-btn refresh-btn"
                    onclick="loadOrders()"
            >
                Refresh Orders
            </button>

        </div>


        <div
                id="ordersContainer"
                class="loading"
        >
            Loading orders...
        </div>

    </section>

</main>


<footer>
    © 2026 Raj Mart. Seller Dashboard.
</footer>


<script>

    /* =========================
       HTML SECURITY
    ========================= */

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

        const container =
            document.getElementById(
                "productsContainer"
            );

        try {

            container.innerHTML =
                '<p class="loading">Loading products...</p>';


            const response =
                await fetch(
                    "/api/products",
                    {
                        method: "GET",
                        headers: {
                            "Accept":
                                "application/json"
                        },
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Products API failed: " +
                    response.status
                );

            }


            const products =
                await response.json();


            if (!Array.isArray(products)) {

                throw new Error(
                    "Invalid products response"
                );

            }


            document.getElementById(
                "productCount"
            ).textContent =
                products.length;


            if (products.length === 0) {

                container.innerHTML =
                    '<div class="empty">No products found.</div>';

                return;
            }


            let html =
                '<div class="products-grid">';


            products.forEach(function(product) {

                const id =
                    product.id ??
                    "-";


                const name =
                    product.name ??
                    "Unknown Product";


                const price =
                    Number(
                        product.price ?? 0
                    );


                const quantity =
                    product.quantity ??
                    product.stock ??
                    0;


                const image =
                    product.image ??
                    product.image_url ??
                    "";


                const stockClass =
                    Number(quantity) <= 5
                        ? "low"
                        : "available";


                let imageHtml;


                if (image) {

                    imageHtml = `
                        <img
                            src="${escapeHtml(image)}"
                            class="product-image"
                            alt="${escapeHtml(name)}"
                            onerror="this.style.display='none'"
                        >
                    `;

                } else {

                    imageHtml = `
                        <div class="no-image">
                            No Image
                        </div>
                    `;

                }


                html += `

                    <div class="product-card">

                        ${imageHtml}

                        <h3>
                            ${escapeHtml(name)}
                        </h3>

                        <p class="product-price">
                            ₹${price.toFixed(2)}
                        </p>

                        <p class="stock ${stockClass}">
                            Stock: ${Number(quantity)}
                        </p>

                        <small>
                            Product ID:
                            ${escapeHtml(id)}
                        </small>

                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${Number(id)}, '${escapeHtml(name)}')"
                        >
                            Delete Product
                        </button>

                    </div>

                `;

            });


            html += "</div>";


            container.innerHTML =
                html;


        } catch (error) {

            console.error(
                "LOAD PRODUCTS ERROR:",
                error
            );


            container.innerHTML =
                '<p class="error">Unable to load products.</p>';

        }

    }


    /* =========================
       DELETE PRODUCT
    ========================= */

    async function deleteProduct(
        productId,
        productName
    ) {

        if (!productId ||
            productId <= 0) {

            alert(
                "Invalid product ID."
            );

            return;
        }


        const confirmed =
            confirm(
                "Delete product \"" +
                productName +
                "\"?"
            );


        if (!confirmed) {
            return;
        }


        try {

            const response =
                await fetch(
                    "/api/products/" +
                    productId,
                    {
                        method: "DELETE",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            console.log(
                "DELETE PRODUCT RESPONSE:",
                data
            );


            if (!response.ok ||
                !data.success) {

                alert(
                    data.message ||
                    "Unable to delete product."
                );

                return;
            }


            alert(
                "Product deleted successfully."
            );


            await loadProducts();


        } catch (error) {

            console.error(
                "DELETE PRODUCT ERROR:",
                error
            );


            alert(
                "Unable to connect to product server."
            );

        }

    }


    /* =========================
       LOAD INCOMING ORDERS
    ========================= */

    async function loadOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        try {

            container.innerHTML =
                '<p class="loading">Loading orders...</p>';


            const response =
                await fetch(
                    "/api/orders/incoming",
                    {
                        method: "GET",
                        headers: {
                            "Accept":
                                "application/json"
                        },
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Orders API failed: " +
                    response.status
                );

            }


            const orders =
                await response.json();


            if (!Array.isArray(orders)) {

                throw new Error(
                    "Invalid orders response"
                );

            }


            document.getElementById(
                "incomingOrders"
            ).textContent =
                orders.length;


            if (orders.length === 0) {

                container.innerHTML =
                    '<div class="empty">No incoming orders yet.</div>';

                return;
            }


            let html = `

                <div class="table-wrapper">

                    <table class="order-table">

                        <thead>

                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Email</th>
                                <th>Payment</th>
                                <th>Subtotal</th>
                                <th>GST</th>
                                <th>Grand Total</th>
                                <th>Status</th>
                            </tr>

                        </thead>

                        <tbody>

            `;


            orders.forEach(function(order) {

                const orderId =
                    order.order_id ??
                    order.orderId ??
                    order.id ??
                    "-";


                const customer =
                    order.customer_name ??
                    order.customerName ??
                    "-";


                const email =
                    order.user_email ??
                    order.userEmail ??
                    order.email ??
                    "-";


                const payment =
                    order.payment_method ??
                    order.paymentMethod ??
                    "-";


                const subtotal =
                    Number(
                        order.subtotal ?? 0
                    );


                const gst =
                    Number(
                        order.gst ?? 0
                    );


                const grandTotal =
                    Number(
                        order.grand_total ??
                        order.grandTotal ??
                        order.total ??
                        0
                    );


                const status =
                    order.status ??
                    "PLACED";


                html += `

                    <tr>

                        <td>
                            #${escapeHtml(orderId)}
                        </td>

                        <td>
                            ${escapeHtml(customer)}
                        </td>

                        <td>
                            ${escapeHtml(email)}
                        </td>

                        <td>
                            ${escapeHtml(payment)}
                        </td>

                        <td>
                            ₹${subtotal.toFixed(2)}
                        </td>

                        <td>
                            ₹${gst.toFixed(2)}
                        </td>

                        <td>
                            <strong>
                                ₹${grandTotal.toFixed(2)}
                            </strong>
                        </td>

                        <td>
                            <span class="status">
                                ${escapeHtml(status)}
                            </span>
                        </td>

                    </tr>

                `;

            });


            html += `

                        </tbody>

                    </table>

                </div>

            `;


            container.innerHTML =
                html;


        } catch (error) {

            console.error(
                "LOAD ORDERS ERROR:",
                error
            );


            document.getElementById(
                "incomingOrders"
            ).textContent =
                "0";


            container.innerHTML =
                '<p class="error">Unable to load incoming orders.</p>';

        }

    }


    /* =========================
       ADD PRODUCT + IMAGE
    ========================= */

    document.getElementById(
        "productForm"
    ).addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "productName"
                ).value.trim();


            const price =
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                );


            const quantity =
                Number(
                    document.getElementById(
                        "productQuantity"
                    ).value
                );


            const imageInput =
                document.getElementById(
                    "productImage"
                );


            const message =
                document.getElementById(
                    "productMessage"
                );


            const button =
                document.getElementById(
                    "addProductBtn"
                );


            /* VALIDATION */

            if (!name) {

                message.className =
                    "error";

                message.textContent =
                    "Product name is required.";

                return;
            }


            if (!Number.isFinite(price) ||
                price <= 0) {

                message.className =
                    "error";

                message.textContent =
                    "Price must be greater than zero.";

                return;
            }


            if (!Number.isInteger(quantity) ||
                quantity < 0) {

                message.className =
                    "error";

                message.textContent =
                    "Quantity cannot be negative.";

                return;
            }


            try {

                button.disabled =
                    true;

                button.textContent =
                    "Adding...";


                message.className =
                    "loading";

                message.textContent =
                    "Uploading product...";


                const formData =
                    new FormData();


                formData.append(
                    "name",
                    name
                );


                formData.append(
                    "price",
                    price
                );


                formData.append(
                    "quantity",
                    quantity
                );


                if (imageInput.files.length > 0) {

                    formData.append(
                        "image",
                        imageInput.files[0]
                    );

                }


                const response =
                    await fetch(
                        "/api/products/add",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                console.log(
                    "ADD PRODUCT RESPONSE:",
                    data
                );


                if (!response.ok ||
                    !data.success) {

                    message.className =
                        "error";

                    message.textContent =
                        data.message ||
                        "Failed to add product.";

                    return;
                }


                message.className =
                    "success";

                message.textContent =
                    "Product added successfully!";


                document.getElementById(
                    "productForm"
                ).reset();


                await loadProducts();


            } catch (error) {

                console.error(
                    "ADD PRODUCT ERROR:",
                    error
                );


                message.className =
                    "error";

                message.textContent =
                    "Unable to connect to product server.";

            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Add Product";

            }

        }
    );


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        localStorage.removeItem("userId");
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        localStorage.removeItem("userRole");

        sessionStorage.removeItem("userId");
        sessionStorage.removeItem("userName");
        sessionStorage.removeItem("userEmail");
        sessionStorage.removeItem("userRole");

        window.location.href =
            "/login.html";

    }


    /* =========================
       PAGE START
    ========================= */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadProducts();

            loadOrders();

        }
    );

</script>

</body>
</html>
